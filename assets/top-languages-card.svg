<svg width="980" height="360" viewBox="0 0 980 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Top Languages Card">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>

    <style>
      .title { font: 700 22px Inter, Segoe UI, Arial, sans-serif; fill: #c9d1d9; }
      .label { font: 700 15px Inter, Segoe UI, Arial, sans-serif; fill: #58a6ff; }
      .pct   { font: 600 13px Inter, Segoe UI, Arial, sans-serif; fill: #c9d1d9; }
      .track { fill: #161b22; stroke: #1f2a3a; }
      .bar   { fill: #58a6ff; opacity: 0.95; }
      .divider { stroke: #1f2a3a; }
    </style>
  </defs>

  <rect x="20" y="20" width="940" height="320" rx="28" fill="url(#bg)" stroke="#1f2a3a" filter="url(#shadow)"/>

  <text x="60" y="75" class="title">Top Languages</text>
  <line x1="60" y1="95" x2="920" y2="95" class="divider"/>

  <!-- ===== Left Column ===== -->
  <!-- Row 1: C# 94% -->
  <text x="60" y="135" class="label">C#</text>
  <text x="455" y="135" text-anchor="end" class="pct">94.00%</text>
  <rect x="60" y="146" width="410" height="12" rx="6" class="track"/>
  <rect x="60" y="146" width="385.4" height="12" rx="6" class="bar"/>

  <!-- Row 2: C++ 88% -->
  <text x="60" y="187" class="label">C++</text>
  <text x="455" y="187" text-anchor="end" class="pct">88.00%</text>
  <rect x="60" y="198" width="410" height="12" rx="6" class="track"/>
  <rect x="60" y="198" width="360.8" height="12" rx="6" class="bar"/>

  <!-- Row 3: Python 99% -->
  <text x="60" y="239" class="label">Python</text>
  <text x="455" y="239" text-anchor="end" class="pct">99.00%</text>
  <rect x="60" y="250" width="410" height="12" rx="6" class="track"/>
  <rect x="60" y="250" width="405.9" height="12" rx="6" class="bar"/>

  <!-- Row 4: Java 92% -->
  <text x="60" y="291" class="label">Java</text>
  <text x="455" y="291" text-anchor="end" class="pct">92.00%</text>
  <rect x="60" y="302" width="410" height="12" rx="6" class="track"/>
  <rect x="60" y="302" width="377.2" height="12" rx="6" class="bar"/>

  <!-- Vertical divider -->
  <line x1="490" y1="120" x2="490" y2="325" class="divider"/>

  <!-- ===== Right Column ===== -->
  <!-- Row 1: Sql 74% -->
  <text x="520" y="135" class="label">Sql</text>
  <text x="915" y="135" text-anchor="end" class="pct">74.00%</text>
  <rect x="520" y="146" width="410" height="12" rx="6" class="track"/>
  <rect x="520" y="146" width="303.4" height="12" rx="6" class="bar"/>

  <!-- Row 2: JavaScript 96% -->
  <text x="520" y="187" class="label">JavaScript</text>
  <text x="915" y="187" text-anchor="end" class="pct">96.00%</text>
  <rect x="520" y="198" width="410" height="12" rx="6" class="track"/>
  <rect x="520" y="198" width="393.6" height="12" rx="6" class="bar"/>

  <!-- Row 3: Html + Css 85% -->
  <text x="520" y="239" class="label">Html + Css</text>
  <text x="915" y="239" text-anchor="end" class="pct">85.00%</text>
  <rect x="520" y="250" width="410" height="12" rx="6" class="track"/>
  <rect x="520" y="250" width="348.5" height="12" rx="6" class="bar"/>

  <text x="60" y="332" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#8b949e">
    Fareszz
  </text>
</svg>
