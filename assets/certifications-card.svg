<svg width="980" height="220" viewBox="0 0 980 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Certifications Card">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>

    <style>
      .title { font: 700 22px Inter, Segoe UI, Arial, sans-serif; fill: #c9d1d9; }
      .label { font: 700 15px Inter, Segoe UI, Arial, sans-serif; fill: #58a6ff; }
      .pct   { font: 600 13px Inter, Segoe UI, Arial, sans-serif; fill: #c9d1d9; }
      .track { fill: #161b22; stroke: #1f2a3a; }
      .bar   { fill: #58a6ff; opacity: 0.95; }
      .divider { stroke: #1f2a3a; }
    </style>
  </defs>

  <rect x="20" y="20" width="940" height="180" rx="28" fill="url(#bg)" stroke="#1f2a3a" filter="url(#shadow)"/>

  <text x="60" y="75" class="title">Certifications</text>
  <line x1="60" y1="95" x2="920" y2="95" class="divider"/>

  <!-- Certification row -->
  <text x="60" y="135" class="label">eJPTv1</text>
  <text x="915" y="135" text-anchor="end" class="pct">100.00%</text>

  <rect x="60" y="150" width="860" height="14" rx="7" class="track"/>
  <rect x="60" y="150" width="860" height="14" rx="7" class="bar"/>
</svg>
